<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F59E0B'><path d='M12 2L3 6v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V6l-9-4z'/></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeUganda — Safer Digital Spaces for Every Child in Uganda</title>
  <meta name="description"
    content="SafeUganda helps children, families and schools prevent cyberbullying, recognize harmful online behaviour, report abuse and build safer digital habits." />

  <!-- Google Fonts: Outfit & Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'uganda-black': '#060B18',
            'uganda-yellow': '#F59E0B',
            'uganda-red': '#EF4444',
            'uganda-cyan': '#06B6D4',
            'uganda-navy': '#0A1224',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body
  class="bg-[#060B18] text-slate-100 font-sans antialiased selection:bg-amber-400 selection:text-slate-900 min-h-screen">
  <div id="root"></div>
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- SafeUganda Production Standalone Engine -->
  <script src="app.js"></script>
</body>

</html>
